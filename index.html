<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>JARVIS</title>
<style>
body {
    margin: 0;
    background: #05070b;
    color: #e8f1ff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
}

.panel {
    text-align: center;
    padding: 50px;
    border: 1px solid #26364d;
    border-radius: 20px;
    background: rgba(15,22,35,.8);
    box-shadow: 0 0 50px rgba(80,150,255,.12);
}

h1 {
    letter-spacing: 10px;
    font-weight: 400;
    margin-bottom: 10px;
}

p {
    opacity: .65;
    letter-spacing: 2px;
}
</style>
</head>

<body>
<div class="panel">
    <h1>JARVIS</h1>
    <p>PERSONAL HOME ASSISTANT</p>
    <p>SONOS CONTROL INTEGRATION</p>
</div>
</body>
</html>
